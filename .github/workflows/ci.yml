name: CI

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # Mesma versao da imagem de producao (Dockerfile: node:22-slim).
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      # ci, e nao install: instala exatamente o package-lock e falha se ele
      # estiver fora de sincronia com o package.json.
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint --if-present
      # O Dockerfile roda o mesmo build: quebrar aqui e quebrar o deploy.
      - name: Build do front
        run: npm run build

      # O globalSetup do Vitest prepara e remove o PostgreSQL 17 temporário,
      # com bootstrap, schema, migrações e seed, como na execução local.
      - name: Run tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Conferir proteção do banco de testes
        run: npx vitest run tests/unit/e2eDatabase.test.js
      - name: Executar E2E com PostgreSQL 17 temporário
        run: npm run test:e2e
      - name: Publicar evidências E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
