<!doctype html>
<html lang="pt-BR">
  <head>

    <title>Sem conexão · Bioma Estoque</title>

      p { color: #475569; font-size: 15px; line-height: 1.5; }

        margin-top: 8px;
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 14px;
        background: #163820;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
